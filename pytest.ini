[pytest]
pythonpath = .
testpaths = tests

# ★DB·임베딩이 있어야 도는 테스트는 **기본 실행에서 뺀다.** 없는 환경에서
#   실패하면 「내 변경이 깼나」를 매번 다시 가려야 한다.
#   돌리려면:  pytest -m needs_db
markers =
    needs_db: Neo4j·PostgreSQL·ChromaDB 와 OpenAI 임베딩이 필요한 대조 테스트
    needs_llm: ★위에 더해 **LLM 을 실제로 부르는** 평가 — 비용과 시간이 든다
addopts = -m "not needs_db and not needs_llm"
