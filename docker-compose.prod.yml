# 서버용 덮어쓰기 — `docker-compose.yml` 과 **함께** 쓴다.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# ★로컬 파일의 `ports:` 는 전부 `0.0.0.0` 에 열린다. 클라우드에 그대로 올리면
#   **DB 가 인터넷에 노출된다** — Neo4j·PostgreSQL 기본 비밀번호를 아는 사람은
#   세상에 많다. 여기서 전부 `127.0.0.1` 로 묶는다.
#
# ★그러면 팀원은 어떻게 접속하나 — **SSH 터널**이다.
#
#       ssh -i key.pem -L 7687:localhost:7687 -L 5432:localhost:5432 ubuntu@서버IP
#
#   터널을 열면 팀원의 로컬 7687 이 서버의 7687 로 이어진다. 방화벽에 구멍을
#   안 뚫고도 Neo4j Browser·DBeaver 를 그대로 쓸 수 있다.
#
# ★바깥에 여는 건 **API 하나(8100)** 뿐이다. 백엔드가 부를 곳이다.

services:
  neo4j:
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      # ★기본 비밀번호를 그대로 두면 안 된다. `.env` 에서 읽는다.
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD 를 .env 에 설정하세요}"
      # 4GB 서버라 힙 1G 가 상한이다. 더 올리면 다른 컨테이너가 죽는다.
      NEO4J_server_memory_heap_max__size: "1G"
      NEO4J_server_memory_pagecache_size: "512M"

  postgres:
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 를 .env 에 설정하세요}"

  chroma:
    ports:
      - "127.0.0.1:8001:8000"

  redis:
    ports:
      - "127.0.0.1:6379:6379"

  # ★pgweb 는 **로그인이 없다.** 열어 두면 누구나 DB 를 다 본다.
  #   서버에서는 아예 띄우지 않는다 — 필요하면 SSH 터널로 로컬에서 본다.
  pgweb:
    profiles: ["never"]

  # ── API 서버 ────────────────────────────────────────────────
  # 로컬에서는 uvicorn 을 직접 띄우지만, 서버에서는 컨테이너로 돌려야
  # 재부팅·크래시 후 자동으로 살아난다(`restart: unless-stopped`).
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: biznode-api
    ports:
      - "8100:8100"        # ★유일하게 바깥에 여는 포트
    env_file: .env
    environment:
      NEO4J_URI: "bolt://neo4j:7687"
      POSTGRES_HOST: "postgres"
      CHROMA_HOST: "chroma"
      CHROMA_PORT: "8000"
    depends_on:
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
